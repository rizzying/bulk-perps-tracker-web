name: sample-platform-oi
on:
  schedule: [{ cron: "*/15 * * * *" }]   # GitHub may delay scheduled runs by several minutes under load
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run sample
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
